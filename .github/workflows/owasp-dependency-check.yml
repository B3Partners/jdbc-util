name: 'OWASP'

env:
  MAVEN_OPTS: -Djava.awt.headless=true

on:
  pull_request:
  schedule:
    - cron: "17 23 * * 0-5"
  workflow_dispatch:

jobs:
  owasp:
    name: 'Dependency Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 'Set up JDK'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: 'Restore OWASP cache'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-maven-${{ github.run_id }}
          restore-keys: |
            owasp-db-maven

      - name: 'Update OWASP Dependency Check Database'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -U org.owasp:dependency-check-maven:update-only -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: 'Save OWASP cache'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-maven-${{ github.run_id }}

      - name: 'Run OWASP Dependency Check'
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -U install -DskipTests -DskipITs -Dmaven.test.skip=true org.owasp:dependency-check-maven:check -fae -B -Dorg.slf4j.simpleLogger.defaultLogLevel=WARN -DfailBuildOnCVSS=5

      - name: 'Upload result to GitHub Code Scanning'
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: target/dependency-check-report.sarif

      - name: 'Cleanup snapshots'
        run: mvn clean build-helper:remove-project-artifact
